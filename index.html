        <div class="section-card">
            <div class="table-header-wrap">
                <h2><i class="fas fa-credit-card"></i>Credit Card Accounts</h2>
                <button class="add-row-btn" onclick="addCcRow()"><i class="fas fa-plus"></i> Add Card / Month</button>
            </div>
            <div class="table-responsive">
                <table id="tableCreditCard" class="dynamic-table">
                    <thead>
                        <tr>
                            <th>Monthly Outstanding Payment</th>
                            <th style="text-align: center;">Action</th>
                            <th style="text-align: right;">Value</th>
                        </tr>
                    </thead>
                    <tbody id="ccTbody">
                        <!-- Default rows will be loaded dynamically -->
                    </tbody>
                    <tfoot>
                        <tr class="calculated-row">
                            <td colspan="2">Total Credit Card Outstanding</td>
                            <td id="ccTotalResult" style="text-align: right;">0.00</td>
                        </tr>
                        <tr class="section-header-row"><td colspan="3">Tabby Credit Card Status</td></tr>
                        <tr>
                            <td colspan="2">Credit Limit</td>
                            <td contenteditable="true" id="tabbyLimitInput" style="text-align: right;" oninput="calculateAll()">0.00</td>
                        </tr>
                        <tr class="calculated-row">
                            <td colspan="2">Credit Balance</td>
                            <td id="tabbyBalanceResult" style="text-align: right;">0.00</td>
                        </tr>
                        <tr class="calculated-row">
                            <td colspan="2">Credit Used</td>
                            <td id="tabbyUsedResult" style="text-align: right;">0.00</td>
                        </tr>
                        <tr class="locked-row">
                            <td colspan="2">Outstanding</td>
                            <td id="tabbyOutstandingResult" style="text-align: right;">0.00</td>
                        </tr>
                        <tr>
                            <td colspan="2">Split Charge</td>
                            <td contenteditable="true" id="tabbySplitInput" style="text-align: right;" oninput="calculateAll()">0.00</td>
                        </tr>
                        <tr class="section-header-row"><td colspan="3">Monthly Split Purchase Status</td></tr>
                    </tfoot>
                </table>
                <table id="tableSplit" class="dynamic-table" style="margin-top: 10px;">
                    <tbody id="splitTbody">
                        <!-- Default split rows will be loaded dynamically -->
                    </tbody>
                    <tfoot>
                        <tr class="calculated-row">
                            <td style="width: 46%;">Total Split Amount</td>
                            <td style="width: 16%; text-align: center;"></td>
                            <td style="width: 38%; text-align: right;" id="splitTotalResult">0.00</td>
                        </tr>
                        <tr class="calculated-row">
                            <td colspan="2">Upcoming Payment</td>
                            <td id="upcomingPaymentResult" style="text-align: right;">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
